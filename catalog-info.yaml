# O Backstage registra este arquivo sozinho quando o pipeline do app é cadastrado
# na página Pipelines (repositório público do GitHub), e a aba Kubernetes já vem
# ligada pela anotação abaixo. Não deixe nenhuma anotação vazia: o catálogo
# recusa o arquivo inteiro.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: csharp
  description: csharp descricao
  annotations:
    backstage.io/kubernetes-id: csharp
    # Template que gerou este arquivo.
    backstage.io/source-template: template:default/generic-app-dockerfile
    # Opcional: preencha pra habilitar a aba "CI/CD" (plugin GitHub Actions).
    # github.com/project-slug: '<owner>/<repo>'
spec:
  type: service
  lifecycle: experimental
  owner: group:default/dev
