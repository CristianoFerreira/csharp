# O pipeline publica este arquivo no catálogo do Backstage a cada execução
# bem-sucedida (repositório público ou privado), e a aba Kubernetes já vem ligada
# pela anotação backstage.io/kubernetes-id. A documentação (pasta docs/) aparece
# na aba TechDocs pela anotação backstage.io/techdocs-ref. Não deixe nenhuma
# anotação vazia: o pipeline recusa o arquivo (a execução falha com o motivo) e o
# catálogo mantém a versão anterior.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: csharp
  description: "csharp"
  tags:
    - "dotnet"
    - "csharp"
    - "api"
    - "net80"
  annotations:
    backstage.io/kubernetes-id: csharp
    backstage.io/techdocs-ref: dir:.
    # Template que gerou este arquivo (valor fixo vindo do template.yaml).
    backstage.io/source-template: template:default/generic-app-completo
    # Opcional: preencha pra habilitar a aba "CI/CD" (plugin GitHub Actions).
    # github.com/project-slug: '<owner>/<repo>'
spec:
  type: service
  lifecycle: experimental
  owner: "group:default/dev"
  # "unknown" DE PROPÓSITO: agrupar apps em Systems é uma decisão de negócio ainda
  # não tomada. O campo fica sempre no arquivo para a pendência ficar visível;
  # troque pelo System do seu app quando ele existir.
  system: unknown
  # Nenhum serviço da plataforma informado. Liste aqui os que o app usa, no
  # formato resource:default/<nome> (ex.: resource:default/minio).
  dependsOn: []
  providesApis:
    - csharp
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: csharp
  description: Contrato da API de csharp (Product API).
spec:
  type: openapi
  lifecycle: experimental
  owner: "group:default/dev"
  system: unknown
  # O pipeline extrai este arquivo de /app/openapi.json na imagem já buildada
  # (gerado no Dockerfile, ver comentário lá) e substitui esta referência pelo
  # conteúdo dele ao publicar no catálogo.
  definition:
    $text: ./openapi.json
